name: Add Documentation Label to Closed Issues

on:
  workflow_dispatch:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  add-label-to-closed-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Add Documentation label to all closed issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'issues') {
              // Triggered by a single issue being closed — label it
              const issue = context.payload.issue;
              const labels = issue.labels.map(l => l.name);
              if (!labels.includes('documentation')) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['documentation'],
                });
                console.log(`Added 'documentation' label to issue #${issue.number}`);
              } else {
                console.log(`Issue #${issue.number} already has 'documentation' label`);
              }
            } else {
              // Triggered manually — label all existing closed issues
              let page = 1;
              let labeled = 0;
              let skipped = 0;
              while (true) {
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'closed',
                  per_page: 100,
                  page: page,
                });
                if (issues.length === 0) break;
                for (const issue of issues) {
                  // Skip pull requests (they appear in issues API)
                  if (issue.pull_request) continue;
                  const labels = issue.labels.map(l => l.name);
                  if (!labels.includes('documentation')) {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      labels: ['documentation'],
                    });
                    console.log(`Added 'documentation' label to issue #${issue.number}: ${issue.title}`);
                    labeled++;
                  } else {
                    console.log(`Issue #${issue.number} already has 'documentation' label — skipped`);
                    skipped++;
                  }
                }
                page++;
              }
              console.log(`Done. Labeled: ${labeled}, Already labeled: ${skipped}`);
            }
